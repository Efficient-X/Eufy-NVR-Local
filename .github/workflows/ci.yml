name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r bridge/requirements.txt \
            pytest==9.0.2 pytest-asyncio==1.3.0 pyyaml==6.0.3 voluptuous==0.15.2 imageio-ffmpeg==0.6.0
      - name: Import runtime dependencies
        run: python -c "import aiohttp, aiortc, av, cryptography, Crypto, websockets"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q bridge custom_components tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n eufy_nvr/run.sh
          bash -n eufy_nvr/guided-entry.sh
          bash -n bridge/start_bridge.sh
          node --check bridge/sctp_oracle.js
          node --check bridge/fetch_deps.js
          node --check bridge/get_auth.js
          node --test tests/test_shared_tiles.mjs
          node --test tests/test_setup_ui.mjs
          node --test tests/test_ptcs_transport.mjs

  addon-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build repository Home Assistant app image
        run: |
          docker build \
            --file eufy_nvr/Dockerfile \
            eufy_nvr
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare the exact guided source package
        run: |
          python -m pip install pyyaml==6.0.3
          python tools/stage_guided_candidate.py --output .ci-guided
          python tools/stage_guided_candidate.py --verify .ci-guided
      - name: Build guided package (not published)
        run: |
          docker build --tag eufy-guided-test \
            --file .ci-guided/Dockerfile \
            .ci-guided
      - name: Check packaged imports without networking
        run: |
          docker run --rm --network none --entrypoint python3 eufy-guided-test \
            -c "import account_setup, guided_launcher, remembered_login, setup_web, startup_controller"
      - name: Exercise real Linux lifecycle in the built image (synthetic state only)
        run: |
          docker run --rm --init --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 2 \
            --mount "type=bind,source=$PWD/.ci-guided/test_tools/linux_candidate_smoke.py,target=/smoke.py,readonly" \
            --entrypoint python3 eufy-guided-test /smoke.py
      - name: Exercise actual S6 guided worker and legacy guard (synthetic state only)
        run: python3 .ci-guided/test_tools/s6_guided_entrypoint_smoke.py --image eufy-guided-test
      - name: Record built dependency versions for distribution review
        run: |
          docker run --rm --network none --entrypoint dpkg-query eufy-guided-test -W
          docker run --rm --network none --entrypoint python3 eufy-guided-test \
            -c "import importlib.metadata as m, json; print(json.dumps([{'name': d.metadata['Name'], 'version': d.version} for d in m.distributions()]))"
      - name: Check the image's S6 stop path (synthetic worker only)
        run: |
          cid="$(docker run --detach --network none --pids-limit 64 --memory 512m --cpus 2 \
            --mount "type=bind,source=$PWD/.ci-guided/test_tools/linux_candidate_smoke.py,target=/smoke.py,readonly" \
            eufy-guided-test python3 /smoke.py --wait-for-stop)"
          trap 'docker rm --force "$cid" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if docker logs "$cid" 2>&1 | grep -q '^READY: synthetic worker'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker stop --time 60 "$cid" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" = 0
          docker logs "$cid" 2>&1 | grep '^PASS: container stop reached CMD'
