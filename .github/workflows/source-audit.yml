name: Image source collection audit

on:
  pull_request:
    paths:
      - 'tools/image_sources.py'
      - 'tools/extra_image_sources.py'
      - 'tools/source_bundle.py'
      - 'tools/prebuilt_release.py'
      - 'tools/overlay_source_inputs.json'
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:
    inputs:
      archive_image:
        description: Keep exact tested image bytes for an experimental prebuilt release
        type: boolean
        default: false

# Review only: cannot create releases, write packages, or publish images.
permissions:
  contents: read

jobs:
  sources:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the checked-out source and app version
        run: |
          python3 -m pip install pyyaml==6.0.3
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('eufy_nvr/config.yaml'))['version'])")" >> "$GITHUB_ENV"
      - name: Build the exact candidate
        run: |
          docker build --tag eufy-source-audit \
            --label org.opencontainers.image.revision="$SOURCE_REVISION" \
            --label org.opencontainers.image.version="$APP_VERSION" \
            --label io.hass.arch="${{ matrix.arch }}" \
            --label io.hass.version="$APP_VERSION" \
            --file eufy_nvr/Dockerfile eufy_nvr
      - name: Test imports and native transport without networking
        run: |
          docker run --rm --network none --entrypoint python3 eufy-source-audit \
            -c 'import av, aiortc, guided_launcher, setup_web, startup_controller'
          docker run --rm --network none --entrypoint node eufy-source-audit \
            /opt/eufy/bridge/sctp_oracle.js selftest
      - name: Test actual H264 HEVC Opus and AAC tools with synthetic media
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 2 \
            --mount "type=bind,source=$PWD/tools/image_video_smoke.py,target=/video-smoke.py,readonly" \
            --entrypoint python3 eufy-source-audit /video-smoke.py
      - name: Test Linux worker lifecycle using synthetic state only
        run: |
          docker run --rm --init --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 2 \
            --mount "type=bind,source=$PWD/tools/linux_candidate_smoke.py,target=/smoke.py,readonly" \
            --entrypoint python3 eufy-source-audit /smoke.py
      - name: Check S6 container stop with a synthetic worker
        run: |
          cid="$(docker run --detach --network none --pids-limit 64 --memory 512m --cpus 2 \
            --mount "type=bind,source=$PWD/tools/linux_candidate_smoke.py,target=/smoke.py,readonly" \
            eufy-source-audit python3 /smoke.py --wait-for-stop)"
          trap 'docker rm --force "$cid" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if docker logs "$cid" 2>&1 | grep -q '^READY: synthetic worker'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker stop --time 60 "$cid" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" = 0
          docker logs "$cid" 2>&1 | grep '^PASS: container stop reached CMD'
      - name: Verify imported platform tagging with real Docker
        env:
          AUDIT_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import prebuilt_release as release
          arch = os.environ['AUDIT_ARCH']
          revision = os.environ['SOURCE_REVISION']
          version = os.environ['APP_VERSION']
          platform = 'linux/' + release.ARCHITECTURES[arch]
          server_api = release.run('docker', 'version', '--format', '{{.Server.APIVersion}}')
          inspect_help = release.run('docker', 'image', 'inspect', '--help')
          if tuple(map(int, server_api.split('.'))) < (1, 49) or '--platform' not in inspect_help:
              print('Publisher import smoke not supported by this native runner:',
                    arch, 'Docker API', server_api, '(platform inspect requires API 1.49).',
                    'Native app, codec and lifecycle tests remain required; publication uses the supported Docker runner.')
              sys.exit(0)
          with tempfile.TemporaryDirectory(prefix='efx-import-smoke-') as folder:
              root = Path(folder)
              original = root / 'original.tar'
              release.run('docker', 'image', 'save', '--output', str(original), 'eufy-source-audit:latest')
              expected = release.archive_config_digest(original, arch, revision, version)
              release.run('docker', 'load', '--platform', platform, '--input', str(original))
              scoped_id = release.loaded_image_identity(expected, arch, revision, version, root)
              legacy = subprocess.run(['docker', 'tag', scoped_id, 'efx-import-smoke:by-id'],
                                      capture_output=True, text=True)
              release.run('docker', 'tag', 'eufy-source-audit:latest', 'efx-import-smoke:verified')
              tagged = root / 'tagged.tar'
              release.run('docker', 'image', 'save', '--platform', platform,
                          '--output', str(tagged), 'efx-import-smoke:verified')
              assert release.archive_config_digest(tagged, arch, revision, version) == expected
              print('Verified native saved-image tagging:', arch, expected,
                    'platform-scoped-ID-taggable=' + str(legacy.returncode == 0))
          PY
      - name: Record the original runtime packages before source collection
        run: |
          mkdir source-review
          docker image inspect eufy-source-audit --format '{{json .}}' > source-review/docker-image.json
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD/tools/image_inventory.py,target=/audit.py,readonly" \
            --mount "type=bind,source=$PWD/source-review,target=/out" \
            --entrypoint python3 eufy-source-audit /audit.py --output /out/software
          git archive --format=tar HEAD > source-review/project-source.tar
          printf '%s\n' "$SOURCE_REVISION" > source-review/source-revision.txt
      - name: Collect exact public sources without running their code
        run: |
          docker run --rm --security-opt no-new-privileges \
            --pids-limit 128 --memory 1g --cpus 2 \
            --mount "type=bind,source=$PWD/tools/image_sources.py,target=/sources.py,readonly" \
            --mount "type=bind,source=$PWD/source-review,target=/out" \
            --entrypoint python3 eufy-source-audit /sources.py \
              --inventory /out/software/inventory.json --output /out/sources \
              --source-revision "$SOURCE_REVISION"
      - name: Collect Go and base-image source and notices without starting the app
        run: python3 tools/extra_image_sources.py --output source-review/upstream
      - name: Package sources into downloadable parts with whole-archive and part hashes
        run: |
          python3 tools/source_bundle.py --source source-review --output source-parts \
            --architecture "${{ matrix.arch }}" --source-revision "$SOURCE_REVISION"
          python3 -c "import json, pathlib; p = next(pathlib.Path('source-parts').glob('*.json')); assert len(json.loads(p.read_text())['parts']) <= 4, 'Review source growth before adding more parts'"
      - name: Preserve the small reports and installed software notices
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: source-summary-${{ matrix.arch }}
          path: |
            source-review/docker-image.json
            source-review/source-revision.txt
            source-review/software/
            source-review/sources/source-report.json
            source-review/upstream/upstream-report.json
            source-review/upstream/notices/
            source-review/upstream/overlay-inputs/notices/
            source-parts/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve source archive part 00
        if: ${{ always() && hashFiles('source-parts/*.part00') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sources-${{ matrix.arch }}-part00
          path: source-parts/*.part00
          compression-level: 0
          retention-days: 7
      - name: Preserve source archive part 01
        if: ${{ always() && hashFiles('source-parts/*.part01') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sources-${{ matrix.arch }}-part01
          path: source-parts/*.part01
          compression-level: 0
          retention-days: 7
      - name: Preserve source archive part 02
        if: ${{ always() && hashFiles('source-parts/*.part02') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sources-${{ matrix.arch }}-part02
          path: source-parts/*.part02
          compression-level: 0
          retention-days: 7
      - name: Preserve source archive part 03
        if: ${{ always() && hashFiles('source-parts/*.part03') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sources-${{ matrix.arch }}-part03
          path: source-parts/*.part03
          compression-level: 0
          retention-days: 7
      - name: Retain the exact tested image for a separately approved publisher
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_image }}
        run: |
          mkdir candidate-image
          docker save eufy-source-audit | gzip -1 > "candidate-image/image-${{ matrix.arch }}.tar.gz"
          python3 tools/prebuilt_release.py record --architecture "${{ matrix.arch }}" \
            --revision "$SOURCE_REVISION" --version "$APP_VERSION" \
            --archive "candidate-image/image-${{ matrix.arch }}.tar.gz" \
            --output "candidate-image/image-${{ matrix.arch }}.json"
      - name: Preserve tested image bytes without publishing them
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_image }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: candidate-image-${{ matrix.arch }}
          path: candidate-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
